projects:
  indexing-daemon:
    name: "Dissertation: Indexing Daemon"
    description: >-
      a reactive file metadata indexing and storage daemon, designed to power
      efficient desktop file search.
    links:
      source:
        label: "GitHub: mcb2003/dissertation"
        url: https://github.com/mcb2003/dissertation
        primary: true
    skill_ids:
      - c
      - linux
      - lmdb
    highlights:
      kernel-apis: >-
        Worked with low-level kernel APIs covering file descriptors and inodes,
        event notification, `/proc`, POSIX threads and I/O multiplexing.
      portable-index-records: >-
        Stored **portable, binary index records** in LMDB in a suitable format
        for search queries.
      constrained-resources: >-
        Designed for **constrained resource environments**, considering CPU use,
        memory growth, I/O behaviour, page-cache interaction and wakeups.
      evaluation: >-
        Evaluated **correctness and performance** with generated datasets, stress
        testing, resource monitoring and verification against canonical
        filesystem state.
    default_highlights:
      - kernel-apis
      - portable-index-records
      - constrained-resources
      - evaluation

  rmlui-accessibility:
    name: RmlUi Accessibility
    description: >-
      A plugin for a user interface renderer designed for games, allowing screen
      reader users to read and interact with the interface using AccessKit.
    links:
      source:
        label: "GitHub: mcb2003/rmlui-accessibility"
        url: https://github.com/mcb2003/rmlui-accessibility
        primary: true
      ai-notice:
        label: AI notice
        url: https://github.com/mcb2003/rmlui-accessibility#ai-assisted-development-notice
    skill_ids:
      - cpp
      - accessibility
      - ui
    highlights:
      incremental-updates: >-
        Designed and built **incremental algorithms and efficient data
        structures** to detect, coalesce and publish accessibility tree updates
        **without rebuilding the whole tree**.
      integration-testing: >-
        Built **end-to-end integration tests** against OS accessibility APIs and
        the Orca screen reader.
      ai-assisted-development: >-
        Used **AI agents** to implement and iterate, but **independently
        designed** its architecture and **reviewed its code** ([AI
        notice](https://github.com/mcb2003/rmlui-accessibility#ai-assisted-development-notice)).
    default_highlights:
      - incremental-updates
      - integration-testing
      - ai-assisted-development

  cyal:
    name: Cyal
    description: An idiomatic Python wrapper for the OpenAL 3D audio library.
    links:
      source:
        label: "GitHub: lower-elements/cyal"
        url: https://github.com/lower-elements/cyal
        primary: true
    skill_ids:
      - python
      - cython
      - audio
    highlights:
      pythonic-native-api: >-
        Designed **Pythonic abstractions over a native C API**, with automatic
        resource cleanup, exceptions and object lifetime management.
      native-extension-toolchain: >-
        Built a **native Python extension toolchain** which compiles multiple
        Cython modules into CPython extension modules.
      release-automation: >-
        Automated cross-platform source and binary PyPI releases using **GitHub
        Actions CI/CD**.
    default_highlights:
      - pythonic-native-api
      - native-extension-toolchain
      - release-automation

  paper-linux:
    name: Paper Linux
    description: The beginnings of an open-source alternative OS for e-readers.
    links:
      source:
        label: "GitHub: lower-elements/paper-linux"
        url: https://github.com/lower-elements/paper-linux
        primary: true
    skill_ids:
      - linux
      - embedded
      - drivers
    highlights:
      legacy-kernel-userspace: >-
        **Ported modern Linux userspace to a legacy 2.6 vendor kernel**, patching
        software as appropriate.
      hardware-bring-up: >-
        Brought up **modern Linux on 2010-eara e-reader hardware**, with Device
        Tree, power, input, storage and SoC support.
      reverse-engineering-tooling: >-
        Built **custom developer and MCP tooling** to index and cross-reference
        kernel revisions, symbols and datasheets to help **reverse engineer
        device behaviour**.
    default_highlights:
      - legacy-kernel-userspace
      - hardware-bring-up
      - reverse-engineering-tooling

